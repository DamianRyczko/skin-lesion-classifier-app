# Base theme: the light colours from ui/tokens.py. The CSS in ui/styles/ paints the rest, in both themes.
[theme]
base = "light"
primaryColor = "#6FC2FF"
backgroundColor = "#F4EFEA"
secondaryBackgroundColor = "#EDE5DC"
textColor = "#2B2B2B"
borderColor = "#2B2B2B"
linkColor = "#1A6FB0"
dataframeHeaderBackgroundColor = "#EDE5DC"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"

[theme.sidebar]
backgroundColor = "#EDE5DC"
secondaryBackgroundColor = "#F4EFEA"

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[logger]
level = "warning"
